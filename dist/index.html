<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Graveyard Gauntlet — A Top-Down Maze Adventure</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
    #game-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; z-index: 10; }
    canvas { display: block; }
    .loading-overlay {
      position: fixed; inset: 0; background: #1a1a1a; color: #e0e0e0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000; font-family: 'Courier New, monospace';
    }
    .loading-bar { width: 300px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-top: 16px; }
    .loading-fill { width: 0%; height: 100%; background: #4ade80; transition: width 0.1s; }
    /* DIAGNOSTIC OVERLAY - outside Phaser canvas */
    #diag-panel {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 99999;
      background: rgba(0, 0, 0, 0.9);
      color: #00ff00;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      padding: 10px;
      border: 2px solid #00ff00;
      border-radius: 4px;
      max-width: 400px;
      display: block;
    }
    #diag-panel .stage { margin: 4px 0; }
    #diag-panel .stage.ok { color: #00ff00; }
    #diag-panel .stage.fail { color: #ff0000; }
    #diag-panel .stage.info { color: #ffff00; }
    #canvas-info {
      position: fixed;
      bottom: 10px;
      left: 10px;
      z-index: 99999;
      background: rgba(0, 0, 0, 0.9);
      color: #00ff00;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      padding: 8px;
      border: 2px solid #00ff00;
      border-radius: 4px;
      display: block;
    }
  </style>
  <script type="module" crossorigin src="/graveyard-gauntlet/assets/game-CIqEv6wv.js"></script>
</head>
<body>
  <div id="game-container"></div>

  <!-- Diagnostic panel outside Phaser canvas -->
  <div id="diag-panel">
    <div style="font-weight: bold; color: #ffffff; margin-bottom: 8px;">GRAVEYARD GAUNTLET — DIAGNOSTICS</div>
    <div id="diag-stage-init" class="stage info">INIT: HTML loaded</div>
    <div id="diag-stage-phaser" class="stage info">PHASER: waiting...</div>
    <div id="diag-stage-boot" class="stage info">BOOT: waiting...</div>
    <div id="diag-stage-main" class="stage info">MAIN: waiting...</div>
    <div id="diag-stage-ui" class="stage info">UI: waiting...</div>
    <div id="diag-errors" class="stage fail" style="display:none;"></div>
  </div>

  <div id="canvas-info"></div>

  <div id="loading-overlay" class="loading-overlay">
    <div style="font-size: 24px; font-weight: bold; letter-spacing: 2px;">GRAVEYARD GAUNTLET</div>
    <div style="font-size: 14px; margin-top: 8px; opacity: 0.8;">Loading...</div>
    <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
  </div>
  <script>
    // Global diagnostic functions that Phaser can call
    window.__diag = {
      setStage: function(id, status, text) {
        const el = document.getElementById(id);
        if (el) {
          el.textContent = text || id;
          el.className = 'stage ' + (status === 'ok' ? 'ok' : status === 'fail' ? 'fail' : 'info');
          el.style.display = 'block';
        }
      },
      addError: function(msg) {
        const el = document.getElementById('diag-errors');
        if (el) {
          el.style.display = 'block';
          el.textContent += 'ERROR: ' + msg + '\\n';
        }
        console.error('DIAG ERROR:', msg);
      },
      updateCanvasInfo: function() {
        const el = document.getElementById('canvas-info');
        const canvas = document.querySelector('canvas');
        if (el && canvas) {
          const rect = canvas.getBoundingClientRect();
          const style = window.getComputedStyle(canvas);
          el.innerHTML = [
            'Canvas: ' + canvas.width + 'x' + canvas.height,
            'CSS: ' + rect.width.toFixed(0) + 'x' + rect.height.toFixed(0),
            'Style w/h: ' + style.width + ' / ' + style.height,
            'Opacity: ' + style.opacity,
            'Visibility: ' + style.visibility,
            'Display: ' + style.display,
            'Z-index: ' + style.zIndex,
            'Position: ' + style.position,
            'Game running: ' + (window.game ? window.game.isRunning : 'no game'),
            'Game booted: ' + (window.game ? window.game.isBooted : 'no game'),
            'Game destroyed: ' + (window.game ? window.game.isDestroyed : 'no game')
          ].join('<br>');
        }
      }
    };

    // Periodically update canvas info
    setInterval(() => {
      if (window.__diag) window.__diag.updateCanvasInfo();
    }, 500);

    // Hide loading overlay when Phaser is ready
    const hideLoading = () => {
      const overlay = document.getElementById('loading-overlay');
      if (overlay) overlay.style.display = 'none';
    };
    const checkReady = setInterval(() => {
      if (window.game && window.game.isBooted) {
        hideLoading();
        clearInterval(checkReady);
      }
    }, 100);
    setTimeout(() => { hideLoading(); clearInterval(checkReady); }, 5000);
  </script>
  <script>
    window.addEventListener('error', function(e) {
      const el = document.getElementById('diag-errors');
      if (el) {
        el.style.display = 'block';
        el.textContent += 'GLOBAL ERROR: ' + (e.message || 'unknown') + ' at ' + (e.filename || 'unknown') + ':' + (e.lineno || 'unknown') + '\\n';
      }
      console.error('GLOBAL ERROR:', e);
    });
    window.addEventListener('unhandledrejection', function(e) {
      const el = document.getElementById('diag-errors');
      if (el) {
        el.style.display = 'block';
        el.textContent += 'UNHANDLED REJECTION: ' + (e.reason || 'unknown') + '\\n';
      }
      console.error('UNHANDLED REJECTION:', e);
    });
  </script>
</body>
</html>
