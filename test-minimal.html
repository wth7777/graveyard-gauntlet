<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Graveyard Gauntlet — Diagnostic Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
    #game-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; z-index: 10; }
    canvas { display: block; }
    #diag-panel {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 99999;
      background: rgba(0, 0, 0, 0.9);
      color: #00ff00;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      padding: 10px;
      border: 2px solid #00ff00;
      border-radius: 4px;
      max-width: 400px;
      display: block;
    }
    #diag-panel .stage { margin: 4px 0; }
    #canvas-info {
      position: fixed;
      bottom: 10px;
      left: 10px;
      z-index: 99999;
      background: rgba(0, 0, 0, 0.9);
      color: #00ff00;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      padding: 8px;
      border: 2px solid #00ff00;
      border-radius: 4px;
      display: block;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <!-- Diagnostic panel outside Phaser canvas -->
  <div id="diag-panel">
    <div style="font-weight: bold; color: #ffffff; margin-bottom: 8px;">GRAVEYARD GAUNTLET — DIAGNOSTIC TEST</div>
    <div id="diag-stage-phaser" class="stage info">PHASER: waiting...</div>
    <div id="diag-stage-main" class="stage info">MAIN: waiting...</div>
    <div id="diag-stage-textures" class="stage info">TEXTURES: waiting...</div>
    <div id="diag-stage-maze" class="stage info">MAZE: waiting...</div>
    <div id="diag-stage-player" class="stage info">PLAYER: waiting...</div>
    <div id="diag-stage-camera" class="stage info">CAMERA: waiting...</div>
    <div id="diag-stage-done" class="stage info">DONE: waiting...</div>
    <div id="diag-errors" class="stage fail" style="display:none;"></div>
  </div>

  <div id="canvas-info"></div>

  <script type="module">
    import Phaser from 'phaser';

    // Global diagnostic functions
    window.__diag = {
      setStage: function(id, status, text) {
        const el = document.getElementById(id);
        if (el) {
          el.textContent = text || id;
          el.className = 'stage ' + (status === 'ok' ? 'ok' : status === 'fail' ? 'fail' : 'info');
          el.style.display = 'block';
        }
      },
      addError: function(msg) {
        const el = document.getElementById('diag-errors');
        if (el) {
          el.style.display = 'block';
          el.textContent += 'ERROR: ' + msg + '\n';
        }
        console.error('DIAG ERROR:', msg);
      },
      updateCanvasInfo: function() {
        const el = document.getElementById('canvas-info');
        const canvas = document.querySelector('canvas');
        if (el && canvas) {
          const rect = canvas.getBoundingClientRect();
          const style = window.getComputedStyle(canvas);
          el.innerHTML = [
            'Canvas: ' + canvas.width + 'x' + canvas.height,
            'CSS: ' + rect.width.toFixed(0) + 'x' + rect.height.toFixed(0),
            'Style w/h: ' + style.width + ' / ' + style.height,
            'Opacity: ' + style.opacity,
            'Visibility: ' + style.visibility,
            'Display: ' + style.display,
            'Z-index: ' + style.zIndex,
            'Position: ' + style.position,
            'Game running: ' + (window.game ? window.game.isRunning : 'no game')
          ].join('<br>');
        }
      }
    };

    setInterval(() => {
      if (window.__diag) window.__diag.updateCanvasInfo();
    }, 500);

    // Test: Minimal Phaser scene with visible background and player
    class TestScene extends Phaser.Scene {
      constructor() {
        super('TestScene');
      }

      create() {
        try {
          console.log('[TEST] create() starting');
          window.__diag.setStage('diag-stage-phaser', 'ok', 'PHASER: Game booted');
          window.__diag.setStage('diag-stage-main', 'ok', 'MAIN: create() started');

          // Bright magenta test background — if this renders, Phaser works
          this.add.rectangle(0, 0, this.cameras.main.width, this.cameras.main.height, 0xff00ff, 1)
            .setOrigin(0, 0)
            .setDepth(1000);
          window.__diag.setStage('diag-stage-main', 'ok', 'MAIN: background rendered');

          // Bright green test player rectangle
          this.testPlayer = this.add.rectangle(200, 200, 40, 40, 0x00ff00, 1)
            .setOrigin(0.5, 0.5)
            .setDepth(2001);
          this.add.rectangle(200, 200, 44, 44, 0xffffff, 0)
            .setOrigin(0.5, 0.5)
            .setStrokeStyle(3, 0xffffff)
            .setDepth(2002);
          window.__diag.setStage('diag-stage-player', 'ok', 'PLAYER: test rect rendered');

          // Simple floor (maze substitute)
          for (let x = 0; x < 20; x++) {
            for (let y = 0; y < 15; y++) {
              this.add.rectangle(x * 40, y * 40, 38, 38, 0x333333, 1)
                .setOrigin(0, 0)
                .setDepth(500);
            }
          }
          window.__diag.setStage('diag-stage-maze', 'ok', 'MAZE: floor tiles rendered');

          // Camera follows test player
          this.cameras.main.startFollow(this.testPlayer, true, 0.1, 0.1);
          this.cameras.main.setZoom(1.5);
          window.__diag.setStage('diag-stage-camera', 'ok', 'CAMERA: following player');

          window.__diag.setStage('diag-stage-done', 'ok', 'DONE: Test scene fully rendered');
          console.log('[TEST] create() completed successfully');
        } catch (err) {
          console.error('[TEST] create() FAILED:', err);
          window.__diag.addError(err.message);
          const el = document.getElementById('diag-errors');
          if (el) el.textContent = 'ERROR: ' + err.message;
        }
      }
    }

    const config = {
      type: Phaser.AUTO,
      parent: 'game-container',
      width: 800,
      height: 600,
      backgroundColor: '#000000',
      pixelArt: true,
      scene: [TestScene]
    };

    window.game = new Phaser.Game(config);
  </script>
</body>
</html>
