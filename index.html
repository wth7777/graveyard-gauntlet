<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Graveyard Gauntlet — A Top-Down Maze Adventure</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
    #game-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; }
    .loading-overlay {
      position: fixed; inset: 0; background: #1a1a1a; color: #e0e0e0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000; font-family: 'Courier New', monospace;
    }
    .loading-bar { width: 300px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-top: 16px; }
    .loading-fill { width: 0%; height: 100%; background: #4ade80; transition: width 0.1s; }
  </style>
  <script type="module" crossorigin src="/graveyard-gauntlet/assets/game-BQvP5uBk.js"></script>
</head>
<body>
  <div id="game-container"></div>
  <div id="loading-overlay" class="loading-overlay">
    <div style="font-size: 24px; font-weight: bold; letter-spacing: 2px;">GRAVEYARD GAUNTLET</div>
    <div style="font-size: 14px; margin-top: 8px; opacity: 0.8;">Loading...</div>
    <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
  </div>
  <script>
    // Hide loading overlay when Phaser is ready
    const hideLoading = () => {
      const overlay = document.getElementById('loading-overlay');
      if (overlay) overlay.style.display = 'none';
    };
    // Try to detect Phaser readiness
    const checkReady = setInterval(() => {
      if (window.game && window.game.isBooted) {
        hideLoading();
        clearInterval(checkReady);
      }
    }, 100);
    setTimeout(() => { hideLoading(); clearInterval(checkReady); }, 5000);
  </script>
</body>
</html>
