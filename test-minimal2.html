<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Phaser Test</title>
</head>
<body>
  <div id="diag">Loading Phaser...</div>
  <div id="game-container"></div>
  <script type="module">
    import Phaser from 'https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.min.js';
    console.log('Phaser loaded:', typeof Phaser);
    const config = {
      type: Phaser.AUTO,
      parent: 'game-container',
      width: 800,
      height: 600,
      backgroundColor: '#ff0000',
      scene: {
        create() {
          console.log('Scene create() ran!');
          document.getElementById('diag').textContent = 'Phaser scene create() ran!';
          this.add.rectangle(400, 300, 100, 100, 0x00ff00);
        }
      }
    };
    const game = new Phaser.Game(config);
    window.game = game;
  </script>
</body>
</html>
